status:
  scope: >-
    Forty-four compared theorems over twenty compared definitions (namespace QubitCloning): the six Pauli
    eigenstates as projectors of their unit vectors (2); Gisin-Massar's bound (F1-bar + F2-bar)/2 <= 5/6 for every
    channel and its pointwise consequence (2); the floor F-bar >= 1/3 and its attainment (2); the Buzek-Hillery
    channel as a Kraus family, its trace preservation, its two marginals, its fidelities 5/6 on every unit vector and
    its six-state averages (6); uniqueness of the channel under the average and under the pointwise criterion, and
    the IsGreatest form of the value 5/6 (3); the asymmetric bound a b <= a(a + 2b)(1 - F1-bar) + b(2a + b)(1 - F2-bar)
    for all a, b >= 0 and its worst-case form (2); the asymmetric family as a Kraus family, its two marginals, its
    fidelities and its equality in the bound (5); uniqueness of the asymmetric optimum for a, b > 0 (1); the
    Buzek-Hillery channel as the symmetric member (1); the square-root form of the trade-off, its worst-case form
    and its equality along the family (3); the full-range trade-off (1); the signed bound and its equality case (2);
    the anticloning bound, its attainment by asymChannel 3 (-1) and its equality case (3); the floor companion bound
    for either clone and its attainment by asymChannel 2 (-1) on every unit vector (3); the stability in the Kraus
    space (1); the full-range equality along the family and its converse (2); the uniqueness of the two floor
    companions (2); a perfect clone forces 1/2 on the other, either way (2); the stability as a channel (1).
    All proved; no sorry, no axiom beyond propext, Classical.choice and
    Quot.sound; no native_decide; Lean v4.35.0-rc2 with Mathlib at the same tag, pinned by the committed manifest.
