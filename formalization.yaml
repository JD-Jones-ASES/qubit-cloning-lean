automation:
  methods:
    - method: "agent"
      models: ["Claude Opus 5.5 (Anthropic)", "Claude Fable 5.1 (Anthropic)", "GPT (OpenAI)"]
      framework: "Claude Code with parallel subagents"
      tool_setup: >-
        The project was directed by its author. Claude (Anthropic) in Claude Code was used throughout: the
        reading of the papers as printed pages, the statements and their check against them, the replay of the
        identities in the standard library, the Lean proofs, the prior-art searches and the repository text,
        by Claude Fable 5.1 and Claude Opus 5.5 subagents in Claude Code, with the proofs audited in separate
        passes; a pre-submission consult by GPT (OpenAI) on the tree at 378b68d (2026-10-11) proposed three modules,
        checked here with the full verification gate before adoption. Lean v4.35.0-rc2 and Mathlib v4.35.0-rc2 (commit
        065356127b1dc0016f66b7283ce0ce2c4055aa55) are pinned by the committed manifest and lake update is never run;
        there are no GitHub Actions workflows. There is no native_decide and no decide +kernel: the proofs are
        polynomial identities in the real and imaginary parts of the Kraus entries closed by ring and
        linear_combination, entrywise computations over Fin 2 x Fin 2 and Fin 6 by fin_cases and simp, and real
        analysis with Real.sqrt for the square-root forms, and Mathlib's Frobenius norm for the channel bound.
  spend_usd: "not tracked"

fidelity:
  divergences: >-
    The figure of merit is the average of the single-clone fidelity over the six Pauli eigenstates (1 +- sigma)/2
    (sixAvg₁, sixAvg₂), not the Bloch-sphere (Haar) average of Gisin-Massar, Fiurasek-Filip-Cerf and
    Nechita-Pellegrini-Rochette, nor the entanglement fidelity of Hashagen's Theorem 6.4 (at d = 2,
    F-bar = (2 F_e + 1)/3, Nielsen 2002, (3)); the six states form a 2-design (the octahedron is a spherical
    3-design), so the two averages agree for every channel (Bowdrey-Oi-Short-Banaszek-Jones 2002, (11)), but that
    equality is neither used nor stated. The pointwise statements (exists_unit_min_le,
    eq_bh_of_forall, isGreatest_cloning_fidelity, asym_bound_forall, tradeoff_forall, bh_fidelity, asym_fidelity)
    quantify over unit vectors psi with star psi . psi = 1, so they are the worst-case forms over pure inputs. A
    channel is a finite Kraus family K : Fin r -> Matrix (Fin 2 x Fin 2) (Fin 2) C with sum K_i^* K_i = 1 acting by
    rho -> sum K_i rho K_i^* (IsChannel, krausApply); the equivalence with completely positive trace-preserving
    maps (Choi-Kraus) is not proved, and the blank qubit is fixed, so the uniqueness statements are about the
    1 -> 2 map, not about two-qubit machines, dilations or Kraus representations (Roubert-Braun 2008). The
    fidelity of a pure state with a matrix is Re Tr(rho sigma) (fidelity), with rho = psi psi^* (proj). The
    partial traces are explicit index sums (traceSecond over the second clone, traceFirst over the first). The
    Buzek-Hillery channel and the asymmetric family are defined as maps on matrices (bhChannel, asymChannel) with
    coefficients rational in the weights, their Kraus families carrying the square roots only inside the existence statements
    (bh_isChannel, asym_isChannel); asymChannel a b is parametrized by unnormalized real weights (a, b) with the
    factor 1/(2(a^2 + ab + b^2)) in place of the conic alpha^2 + alpha beta + beta^2 = 1 of Fiurasek-Filip-Cerf,
    Cerf and Scarani et al. ((alpha, beta) = (a, b)/sqrt(a^2 + ab + b^2)), and the asymmetric bound is stated
    homogeneously in (a, b) (Fiurasek-Filip-Cerf's weights are (a(a + 2b), b(2a + b)), the square root of their
    eigenvalue formula being a^2 + ab + b^2); for a = b = 0 asymChannel is the zero map by Lean's x/0 = 0 and the
    statements carry a^2 + ab + b^2 != 0. Uniqueness is equality of the maps krausApply K and bhChannel, resp.
    asymChannel a b, on every input matrix. The floor is the six-state average form of the universal-NOT bound;
    Buzek-Hillery-Werner state the worst-case form and Gisin-Popescu the Bloch-average form. The square-root
    statements use Real.sqrt and hold with Lean's Real.sqrt of a negative number equal to 0, the hypotheses being
    those printed; tradeoff_forall is stated for every f_1, f_2 with f_i <= F_i(psi) on every unit psi, the
    nonnegativity of 1 - f_i being a consequence. The full-range and signed statements concern the six-state
    averages themselves: a lower bound on F-bar_i cannot be substituted into them, so they have no worst-case forms
    here; the realization of every point of the region (the sufficiency half of Nechita-Pellegrini-Rochette's
    Theorem 6, negative singlet fractions included) is not formalized, only that of its boundary arc
    (tradeoff_full_attained). The stability is in the Frobenius norm: kraus_span_stability bounds the total squared
    distance of the Kraus operators to span{V1, V2}, and channel_stability the Frobenius distance of the outputs
    from the Buzek-Hillery channel's on every input matrix; the trace-norm and diamond-norm forms are not
    formalized.

review:
  status: "self-assessed"
  notes: >-
    No independent human expert review and no source-author endorsement is claimed; AI agents wrote the proofs
    and audited them in separate passes, the statements were checked against the printed pages of the papers by
    a separate reading pass, the identities behind every statement are replayed by scripts/check_cloning.py and
    scripts/check_extensions.py in the standard library, and VERIFICATION.md states what is checked and what is not.
    Mechanical correctness and
    agreement of formal statements do not establish significance: the bound is Gisin-Massar's, the channel and
    its fidelity Buzek-Hillery's, the asymmetric bound, the family and its fidelities Fiurasek-Filip-Cerf's
    (the curve Niu-Griffiths's, the conic Cerf's), the square-root form Scarani-Iblisdir-Gisin-Acin's, the floor
    Buzek-Hillery-Werner's and Gisin-Popescu's; what this development adds is the six-state form, the explicit
    sums of squares in the Kraus entries, the homogeneous weight form, and the uniqueness statements under the
    average-fidelity criterion (Keyl-Werner's uniqueness is for the trace-norm one-clone criterion, Werner's for
    the global criterion, Hashagen's within symmetrized channels), and, in the extension, a Gram-identity proof of
    the full-range trade-off (the necessity half of Nechita-Pellegrini-Rochette's Theorem 6 at d = 2), the signed
    bounds with the anticloning line, the equality cases over all channels, the floor companion's uniqueness and the
    stability bounds. No earlier kernel check of any of these
    statements was found by the dated searches (Palomar's feed and day index, Mathlib, formal-conjectures,
    openai/math, physlib, Lean-QIT, QICLean, csd-lean4, atlas-lean, trureturing, JWang226/Cloning, lean-eval,
    anthropics/formal-math, the Isabelle AFP, the Rocq package index, GitHub code search in Lean, Isabelle and
    Coq, Zenodo, Hexagon and the arXiv listing on 2026-10-09 and 2026-10-11 UTC; for the extension's statements,
    Palomar's feed, day index and entry files, Mathlib master, the AFP mirror, GitHub code, pull-request and issue
    search and the pushes of the named repositories on 2026-10-11 UTC); physlib's wishlist names the
    5/6 bound as wanted, csd-lean4 holds qualitative no-cloning and channel no-broadcasting and names a
    quantitative cloning bound as a later tranche, and JWang226/Cloning formalizes asymptotic global-fidelity
    cloning.

alignment:
  namespace: "QubitCloning"
  statements:
    - source: "This development (the six Pauli eigenstates as projectors of their unit vectors)"
      lean: "QubitCloning.proj_pauliVec"
      module: "Solution"
      status: "proved"
      note: "Each Pauli eigenstate is the projector onto its unit vector."
    - source: "This development (the six unit vectors)"
      lean: "QubitCloning.pauliVec_unit"
      module: "Solution"
      status: "proved"
      note: "The six vectors are unit vectors."
    - source: "Gisin-Massar 1997, (12)-(17) and p. 4, at M = 2, with the six-state average (a 2-design) in place of the Bloch-sphere average; Bruss et al. 1998, (16), within their ansatz"
      lean: "QubitCloning.sixAvg_le"
      module: "Solution"
      status: "proved"
      note: "Gisin–Massar's bound in the six-state form: for every channel the mean single-clone fidelity, averaged over the six Pauli eigenstates, is at most `5/6`."
    - source: "This development (the pointwise consequence of Gisin-Massar's bound)"
      lean: "QubitCloning.exists_unit_min_le"
      module: "Solution"
      status: "proved"
      note: "No channel clones every pure state with both fidelities above `5/6`: some unit vector has `min (F₁, F₂) ≤ 5/6`."
    - source: "This development (the six-state average form of the universal-NOT bound, from the certificate; cf. Buzek-Hillery-Werner 1999, the Theorem at N = 1, and Gisin-Popescu 1999, p. 4)"
      lean: "QubitCloning.sixAvg_ge_third"
      module: "Solution"
      status: "proved"
      note: "The six-state average of either clone's fidelity is at least `1/3` for every channel (the universal-NOT bound in average form: no channel anti-clones better than the universal NOT)."
    - source: "This development (the universal NOT (1/3)(X rho X + Y rho Y + Z rho Z) on one clone, maximally mixed other clone)"
      lean: "QubitCloning.exists_sixAvg_eq_third"
      module: "Solution"
      status: "proved"
      note: "The floor `1/3` is attained: the universal NOT on the first clone with a maximally mixed second clone."
    - source: "Buzek-Hillery 1996, (3.29), as a Kraus family"
      lean: "QubitCloning.bh_isChannel"
      module: "Solution"
      status: "proved"
      note: "The Bužek–Hillery map is a channel: it has a Kraus family."
    - source: "Buzek-Hillery 1996 (trace preservation of (3.29))"
      lean: "QubitCloning.bh_trace"
      module: "Solution"
      status: "proved"
      note: "The Bužek–Hillery map preserves the trace."
    - source: "Buzek-Hillery 1996, (4.6); Werner 1998, (3.7)-(3.8) for every input matrix"
      lean: "QubitCloning.bh_traceSecond"
      module: "Solution"
      status: "proved"
      note: "The first marginal of the Bužek–Hillery channel is the depolarizing map `ρ ↦ (2/3) ρ + (1/6) Tr(ρ)·1`."
    - source: "Buzek-Hillery 1996, (4.6); Werner 1998, (3.7)-(3.8) for every input matrix"
      lean: "QubitCloning.bh_traceFirst"
      module: "Solution"
      status: "proved"
      note: "The second marginal of the Bužek–Hillery channel is the same depolarizing map."
    - source: "Buzek-Hillery 1996, p. 7 item (2) (root fidelity sqrt(5/6)); Werner 1998, p. 8"
      lean: "QubitCloning.bh_fidelity"
      module: "Solution"
      status: "proved"
      note: "Any Kraus family of the Bužek–Hillery channel clones every pure state with both fidelities `5/6`."
    - source: "This development (the six-state averages of the Buzek-Hillery channel)"
      lean: "QubitCloning.bh_sixAvg"
      module: "Solution"
      status: "proved"
      note: "Its six-state averages are `5/6` and `5/6`."
    - source: "This development (uniqueness under the average-fidelity criterion; Keyl-Werner 1999, Theorem 1, is the printed uniqueness under Delta_one, Werner 1998, Section 4, under the global criterion)"
      lean: "QubitCloning.eq_bh_of_sixAvg"
      module: "Solution"
      status: "proved"
      note: "Equality in the bound forces the channel: a channel whose six-state mean fidelity is `5/6` is the Bužek–Hillery channel as a map."
    - source: "This development (uniqueness under the pointwise criterion, from the average form)"
      lean: "QubitCloning.eq_bh_of_forall"
