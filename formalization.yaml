    - source: "Fiurasek-Filip-Cerf 2005, (11)-(16) at d = 2, written homogeneously in the weights (a, b) with sqrt(A^2 - AB + B^2) = a^2 + ab + b^2, with the six-state average (this development); cf. Hashagen 2017, (6.4a)"
