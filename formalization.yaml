# yaml-language-server: $schema=https://raw.githubusercontent.com/mathlib-initiative/formalization.yaml/main/schema/formalization.schema.json
version: "v0.4"

project:
  name: "Universal 1 -> 2 qubit cloning: (F1 + F2)/2 <= 5/6 with the Buzek-Hillery channel as its unique optimum and its stability, the universal-NOT floor 1/3 and its companion 5/6, the trade-off 3(F1 + F2) - 7/2 <= sqrt((3F1 - 1)(3F2 - 1)) with its equality family, and the anticloning bound 3F1 - 5F2 <= 1"
  description: >-
    A Lean 4 development of the optimal universal 1 -> 2 cloning of a qubit, with every figure of merit
    finite: a channel from one qubit to two is a finite Kraus family K_i : C^2 -> C^2 (x) C^2 with
    sum K_i^* K_i = 1 (the blank qubit is fixed, so this is a 1 -> 2 map; the Choi-Kraus theorem is not
    proved), the two clone fidelities of a pure input psi are Re <psi| Tr_2 Lambda(psi psi^*) |psi> and
    Re <psi| Tr_1 Lambda(psi psi^*) |psi>, and F1-bar, F2-bar are their averages over the six Pauli
    eigenstates (1 +- sigma)/2, Gaussian-rational density matrices (the six states form a 2-design, the octahedron
    being a spherical 3-design, so these equal the Bloch-sphere averages of Gisin-Massar, as
    Bowdrey-Oi-Short-Banaszek-Jones 2002, (11), print for qubit maps; that equality is neither used nor claimed).
    Theorems,
    kernel-only: for every channel (F1-bar + F2-bar)/2 <= 5/6, so some unit psi has min(F1, F2) <= 5/6
    (Gisin-Massar 1997, their largest-eigenvalue bound; Bruss-DiVincenzo-Ekert-Fuchs-Macchiavello-Smolin 1998
    within the symmetric isotropic ansatz), proved by a six-term sum of squares in the Kraus entries; the
    Buzek-Hillery channel (1/6) V1 rho V1^* + (2/3) V2 rho V2^* (V1|0> = 2|00>, V1|1> = |01> + |10>,
    V2|0> = (|01> + |10>)/2, V2|1> = |11>; Buzek-Hillery 1996, (3.29)) is a channel whose two marginals are
    rho -> (2/3) rho + (1/6) Tr(rho) 1 (their (4.6); Werner 1998, (3.7)-(3.8)), so F1 = F2 = 5/6 for every unit psi
    (their root fidelity sqrt(5/6), p. 7); a channel with (F1-bar + F2-bar)/2 = 5/6, or with F1, F2 >= 5/6 on every
    unit psi, is the Buzek-Hillery channel as a map (the uniqueness under the average-fidelity criterion is proved
    here from the certificate; Keyl-Werner 1999 prove uniqueness under the worst-case one-clone criterion
    Delta_one and Werner 1998 under the global criterion; the Kraus family and the dilation are not unique,
    Roubert-Braun 2008), so 5/6 is the greatest t for which some channel has t <= F1(psi), F2(psi) for every unit
    psi, in Lean's IsGreatest form; F1-bar, F2-bar >= 1/3 for every channel, attained for the first clone by the
    universal NOT on it with a maximally mixed second clone (the universal-NOT bound of Buzek-Hillery-Werner 1999 and
    Gisin-Popescu 1999, in six-state average form); the asymmetric trade-off a b <= a(a + 2b)(1 - F1-bar) +
    b(2a + b)(1 - F2-bar) for every channel and all weights a, b >= 0, also with worst-case fidelities in place of
    the averages (the largest-eigenvalue bound of Fiurasek-Filip-Cerf 2005, Section II, in every dimension, with
    their conic alpha^2 + alpha beta + beta^2 = 1 written homogeneously; Hashagen 2017, (6.4a); the curve of Niu-Griffiths
    1998, (6.29); the conic of Cerf, J. Mod. Opt. 2000, (2.31), and x^2 + x'^2 + x x' >= 1/4 of Cerf, PRL 2000, (6);
    Buzek-Hillery-Bednik 1998, (11); the full achievable region in
    Hashagen 2017 and Nechita-Pellegrini-Rochette 2021), proved by a sum of squares polynomial in a, b; the
    family (A0 rho A0^* + A1 rho A1^*)/(2(a^2 + ab + b^2)) with A0|0> = (a + b)|00>, A0|1> = a|10> + b|01>,
    A1|0> = a|01> + b|10>, A1|1> = (a + b)|11> (the optimal asymmetric cloner of Niu-Griffiths (4.13), Cerf, J. Mod. Opt. 2000, (2.28),
    Fiurasek-Filip-Cerf (19), Scarani-Iblisdir-Gisin-Acin 2005 (27)) consists of channels with marginals
    rho -> (1 - b^2/s) rho + (b^2/2s) Tr(rho) 1 and rho -> (1 - a^2/s) rho + (a^2/2s) Tr(rho) 1, s = a^2 + ab + b^2,
    so F1 = 1 - b^2/2s and F2 = 1 - a^2/2s on every unit psi, with equality in the bound at the weights (a, b),
    and for a, b > 0 equality holds only for that channel (proved here; Hashagen's uniqueness is within
    symmetrized channels); a = b is the Buzek-Hillery channel; hence the square-root form
    sqrt((1 - F1-bar)(1 - F2-bar)) >= F1-bar + F2-bar - 3/2 (Scarani-Iblisdir-Gisin-Acin 2005, (23)), its
    worst-case form, and equality along the family for a, b >= 0 (the curve of Niu-Griffiths (6.29)). For every
    channel 3(F1-bar + F2-bar) - 7/2 <= sqrt((3F1-bar - 1)(3F2-bar - 1)), binding also where a clone is below 1/2 (the
    necessity half of Nechita-Pellegrini-Rochette 2021, Theorem 6, at d = 2 for the six-state averages; Hashagen 2017,
    Theorem 6.4, in entanglement fidelity), proved by a Gram identity in the Kraus entries and Cauchy-Schwarz, with
    equality along the family when (2a + b)(a + 2b) >= 0 and, with neither clone perfect, only there; a perfect clone
    on average leaves the other at 1/2 (Hashagen 2017, p. 20, via Nielsen 2002, (3)); the asymmetric bound holds for
    all real a, b with (2a + b)(a + 2b) >= 0, the family being its only equality case when the product is positive and
    a, b != 0, and at (3, -1) it is the anticloning bound 3F1-bar - 5F2-bar <= 1, attained only by asymChannel 3 (-1),
    at (13/14, 5/14); F2-bar = 1/3 forces F1-bar <= 5/6, and (5/6, 1/3) is attained only by asymChannel 2 (-1), on
    every unit psi, the Buzek-Hillery clone with its anti-clone (Scarani-Iblisdir-Gisin-Acin 2005, (12)-(15)), and
    likewise with the clones exchanged; if (F1-bar + F2-bar)/2 >= 5/6 - eps, the Kraus operators lie within total
    squared Frobenius distance 6 eps of span{V1, V2}, and ||Lambda(rho) - Lambda_BH(rho)||_F <= 200 sqrt(eps)
    ||rho||_F for every input rho. Forty-four compared statements over twenty fully specified definitions; the
    identities behind every statement are replayed in rational arithmetic in the standard library by
    scripts/check_cloning.py and scripts/check_extensions.py. As of 2026-10-11 no
    formalization of the fidelity bound, of the Buzek-Hillery marginals, of the uniqueness, of the floor or of any
    asymmetric trade-off was located in the Palomar registry, Mathlib, formal-conjectures, openai/math, physlib,
    Lean-QIT, QICLean, csd-lean4, atlas-lean, trureturing, JWang226/Cloning (asymptotic global-fidelity cloning,
    a different figure of merit), the Isabelle AFP, the Rocq package index or arXiv; physlib's wishlist names the
    5/6 bound as wanted and csd-lean4 holds the qualitative no-cloning and no-broadcasting theorems; nor, on the same
    date, of the full-range or signed trade-offs, their equality cases or the stability in the Palomar registry,
    Mathlib, formal-conjectures, physlib, Lean-QIT, QICLean, csd-lean4, atlas-lean, trureturing, JWang226/Cloning, the
    Isabelle AFP or GitHub code search.
  url: "https://github.com/JD-Jones-ASES/qubit-cloning-lean"
  license: "MIT"
  authors: ["JD Jones"]
  contact: "https://github.com/JD-Jones-ASES/qubit-cloning-lean/issues"

