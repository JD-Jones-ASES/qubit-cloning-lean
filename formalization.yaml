  arxiv: ["quant-ph"]
  msc2020: ["81P45", "81P47", "15A45"]

sources:
  - title: "Quantum copying: Beyond the no-cloning theorem"
    authors: ["Vladimir Bužek", "Mark Hillery"]
    id: "doi:10.1103/PhysRevA.54.1844"
    type: "paper"
    location: >-
      Physical Review A 54 (1996), 1844; read as arXiv:quant-ph/9607018v1 (https://arxiv.org/abs/quant-ph/9607018),
      printed pages: the transformation (3.2) with eta = 1 - 2 xi (3.10a) and xi = 1/6 from (3.13), pp. 5-7; the clone
      state (3.16) with eigenvalues 5/6 and 1/6 and the root fidelity sqrt(5/6) for every input, item (2), p. 7; the
      Bloch scaling 2/3, (3.23), p. 8; the explicit machine (3.29), p. 8; the reduced state (2/3) rho + (1/6) 1, (4.6),
      p. 9; the open question of optimality, item (4), p. 8, and the conclusions, p. 11; the Hilbert-Schmidt distances
      (2.10), (2.15). The journal print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The channel: bhChannel is their machine (3.29) written as a map on density matrices with the Kraus operators
      V1/sqrt(6) and sqrt(2/3) V2 (the standard-library replay checks that (3.29) and bhChannel are the same
      channel); bh_traceSecond and bh_traceFirst are their (4.6) for every input matrix; bh_fidelity is their root
      fidelity sqrt(5/6) squared. Their figure of merit is the Hilbert-Schmidt distance and they claim no optimality;
      the bound, the uniqueness and the asymmetric statements are not theirs.
  - title: "Optimal quantum cloning machines"
    authors: ["Nicolas Gisin", "Serge Massar"]
    id: "doi:10.1103/PhysRevLett.79.2153"
    type: "paper"
    location: >-
      Physical Review Letters 79 (1997), 2153; read as arXiv:quant-ph/9705046v2 (https://arxiv.org/abs/quant-ph/9705046),
      all four pages: the figure of merit F = int dOmega <psi| rho_out |psi>, (1); F_{1,M} = (2M + 1)/(3M), (4), and
      F_{N,M}, (6); the symmetric-output hypothesis (9) and its removal by averaging over permutations and rotations,
      p. 4; the largest-eigenvalue bound (12)-(17): a trace constraint (14), F = 2 lambda (16), lambda_max = (2M + 1)/(6M).
      The journal print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The bound: sixAvg_le is their (F1 + F2)/2 <= 5/6 at M = 2 with the average over the six Pauli eigenstates in
      place of the Bloch-sphere integral (equal, since the octahedron is a 3-design, which is not claimed), proved by
      their method, the largest eigenvalue 5/12 of the averaged operator, written here as an explicit sum of squares
      in the Kraus entries; exists_unit_min_le is its pointwise consequence. They claim no uniqueness.
  - title: "Optimal universal and state-dependent quantum cloning"
    authors: ["Dagmar Bruß", "David P. DiVincenzo", "Artur Ekert", "Christopher A. Fuchs", "Chiara Macchiavello", "John A. Smolin"]
    id: "doi:10.1103/PhysRevA.57.2368"
    type: "paper"
    location: >-
      Physical Review A 57 (1998), 2368; read as arXiv:quant-ph/9705038v3 (https://arxiv.org/abs/quant-ph/9705038),
      pp. 1-9 and 23-28: the hypotheses I (equal clones), II.a-b (no Bloch rotation, isotropy), p. 4, the ansatz (3)-(4)
      and the symmetry (A2); eta = 2/3, (15), and F = 5/6, (16); the class of optimal unitaries (17)-(18) = (A25)-(A26);
      the remark on global fidelity, p. 9. The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The value 5/6 and the optimal unitaries within the symmetric, isotropic ansatz; the Bužek-Hillery machine is
      their case delta = 0, |A> = |0>. Nothing from it is formalized; the bound here holds for every channel
      without the ansatz, and the uniqueness here is of the channel under the average criterion, which their
      ansatz-level class does not give.
  - title: "Optimal cloning of pure states"
    authors: ["Reinhard F. Werner"]
    id: "doi:10.1103/PhysRevA.58.1827"
    type: "paper"
    location: >-
      Physical Review A 58 (1998), 1827; read as arXiv:quant-ph/9804001 (https://arxiv.org/abs/quant-ph/9804001),
      pp. 4 and 6-9: the worst-case global fidelity (2.1); the optimal map T-hat (3.3); the one-site restriction
      gamma rho + (1 - gamma) tr(rho) 1/2 with gamma = 2/3, (3.7)-(3.8), and the single-clone value 5/6, p. 8; the
      theorem of Section 4, equality iff T = T-hat for the global criterion, p. 9. The journal print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The marginal form for every input matrix: bh_traceSecond and bh_traceFirst are his (3.7)-(3.8) at (d, N, M) =
      (2, 1, 2) (the replay checks that T-hat is bhChannel). His uniqueness theorem is for the global criterion and
      is not formalized; the uniqueness here is under the single-clone average criterion.
  - title: "Optimal cloning of pure states, testing single clones"
    authors: ["Michael Keyl", "Reinhard F. Werner"]
    id: "doi:10.1063/1.532887"
    type: "paper"
    location: >-
      Journal of Mathematical Physics 40 (1999), 3283; read as arXiv:quant-ph/9807010 (https://arxiv.org/abs/quant-ph/9807010),
      pp. 1-3 and 10-11: the worst-case one-clone criterion Delta_one, (1); Theorem 1 with equality iff T = T-hat,
      p. 3 (the value 1/6 at d = 2); Section III.F, p. 11, the uniqueness from the unique covariant optimum (Lemma 6)
      and Proposition 7. Pages 4-9 and 12-16 and the journal print were not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The printed uniqueness of the optimal 1 -> M cloner for a single-clone criterion, the trace-norm Delta_one;
      no average-fidelity statement appears in the pages read. Nothing from it is formalized; eq_bh_of_forall and
      eq_bh_of_sixAvg state and prove uniqueness under the average-fidelity criterion from the sum-of-squares
      certificate, and the docs credit their theorem as the printed uniqueness under Delta_one.
  - title: "Optimal copying of one quantum bit"
    authors: ["Chi-Sheng Niu", "Robert B. Griffiths"]
    id: "doi:10.1103/PhysRevA.58.4377"
    type: "paper"
    location: >-
      Physical Review A 58 (1998), 4377-4393; read as arXiv:quant-ph/9805073v1 (https://arxiv.org/abs/quant-ph/9805073),
      pp. 1-3 and 6-21: the distinguishability measure (3.4) and its Bloch semi-axis form (3.10), (3.12); the machine
      (4.13) with the normalization (4.8), (4.9), (4.17); the isotropic trade-off s = (1/2)[1 - r + sqrt((1 - r)(1 + 3r))],
      (6.29); the best second copy for a fixed first copy, Sections IV-V; the unproved (6.19), p. 17; the Bužek-Hillery
      case beta_q = 1/sqrt(12), p. 21. The journal print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The family: asymChannel a b is their machine (4.13) with beta_0 = alpha + beta/2 and beta_1 = beta_2 = beta_3
      = beta/2, (alpha, beta) = (a, b)/sqrt(a^2 + ab + b^2) (the replay checks the channels agree), and their
      normalization (4.8) is the conic; tradeoff_attained is their equality curve (6.29), equivalent to
      (1 - F1) + (1 - F2) + sqrt((1 - F1)(1 - F2)) = 1/2. Their measure is distinguishability, their optimality of the
      pair is not rigorous (p. 17), and the bound for every channel (asym_bound) and the uniqueness
      (eq_asym_of_equality) are not theirs.
  - title: "Pauli cloning of a quantum bit"
    authors: ["Nicolas J. Cerf"]
    id: "doi:10.1103/PhysRevLett.84.4497"
    type: "paper"
    location: >-
      Physical Review Letters 84 (2000), 4497; read as arXiv:quant-ph/9803058v2 (https://arxiv.org/abs/quant-ph/9803058,
      titled there "Quantum cloning and the capacity of the Pauli channel"), pp. 1-4: the asymmetric Pauli cloning
      machine (2); the no-cloning inequality x^2 + x'^2 + x x' >= 1/4, (6), with F = 1 - 2x^2 and p = 3x^2; optimality
      "strongly suggested", p. 3. The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The conic form of the trade-off for the universal case of his Pauli cloner, x = beta/2, x' = alpha/2 (the
      machine with v = alpha + beta/2 and x = y = z = beta/2 is asymChannel, checked by the replay). Nothing from it is
      formalized; the inequality here is proved for every channel in the homogeneous weight form.
  - title: "Asymmetric quantum cloning machines in any dimension"
    authors: ["Nicolas J. Cerf"]
    id: "arXiv:quant-ph/9805024"
    type: "paper"
    location: >-
      Journal of Modern Optics 47 (2000), 187; read as arXiv:quant-ph/9805024v2 (https://arxiv.org/abs/quant-ph/9805024),
      pp. 5-8: the x-inequality (2.24); the machine (2.28); the conic a^2 + ab + b^2 >= 1, (2.31), with pi_a = a^2,
      pi_b = b^2, (2.32); the optimality proviso (a single additional qubit), p. 6; footnotes 5-6 (Niu-Griffiths
      independently; the symmetric case by Bruß et al. and Gisin-Massar). The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The conic in the form a^2 + ab + b^2 >= 1 with (a, b) = (beta, alpha) in this development's names. Nothing from
      it is formalized.
  - title: "Controlling the flow of information in quantum cloners: asymmetric cloning"
    authors: ["Vladimir Bužek", "Mark Hillery", "Radoslav Bednik"]
    id: "arXiv:quant-ph/9807086"
    type: "paper"
    location: >-
      Acta Physica Slovaca 48 (1998), 177; read as arXiv:quant-ph/9807086 (https://arxiv.org/abs/quant-ph/9807086),
      all eight pages: the clones rho_j = s_j rho + (1 - s_j) 1/2, (4); the network (5), (7), (9)-(10); the range
      s_0^2 + s_1^2 + s_0 s_1 - s_0 - s_1 <= 0, (11); the identification with Cerf's Pauli cloning machine, (18).
      The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Their network realizes asymChannel with s_0 = 1 - beta^2, s_1 = 1 - alpha^2 (checked by the replay); their (11)
      is the range of the network, not a bound for every channel. Nothing from it is formalized.
  - title: "Highly asymmetric quantum cloning in arbitrary dimension"
    authors: ["Jaromír Fiurášek", "Radim Filip", "Nicolas J. Cerf"]
    id: "arXiv:quant-ph/0505212"
    type: "paper"
    location: >-
      Quantum Information and Computation 5 (2005), 583; read as arXiv:quant-ph/0505212 (https://arxiv.org/abs/quant-ph/0505212),
      Section II: the averaged operator L_A = [1 + d Phi^+_{RA} (x) 1]/(d(d + 1)), (8)-(9); the largest-eigenvalue bound
      p F_A + (1 - p) F_B <= d lambda_max, (11)-(12), the eigenvalues (16); the top eigenvectors alpha |Phi^+>_{RA}|k> +
      beta |Phi^+>_{RB}|k>, (15), with alpha^2 + beta^2 + 2 alpha beta/d = 1, (18); the optimal map (19) and the fidelities
      F_A = 1 - ((d - 1)/d) beta^2, F_B = 1 - ((d - 1)/d) alpha^2, (22). The journal print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The asymmetric bound and the family, at d = 2: asym_bound is their (11)-(16) for the weights A = a(a + 2b),
      B = b(2a + b), where sqrt(A^2 - AB + B^2) = a^2 + ab + b^2 makes the bound polynomial, with the six-state average
      in place of their Haar average; the operators 6 W_i = 1 + Omega_i of the certificate are their L_A, L_B; the
      certificate is the sum of squares of the kernel of lambda_max 1 - (A L_A + B L_B) written in the Kraus entries;
      asymChannel is their (19) and asym_fidelity their (22). Their optimality proof covers all channels under the
      Haar average and claims no uniqueness; eq_asym_of_equality is proved here.
  - title: "Quantum cloning"
    authors: ["Valerio Scarani", "Sofyan Iblisdir", "Nicolas Gisin", "Antonio Acín"]
    id: "doi:10.1103/RevModPhys.77.1225"
    type: "paper"
    location: >-
      Reviews of Modern Physics 77 (2005), 1225; read as arXiv:quant-ph/0511088 (https://arxiv.org/abs/quant-ph/0511088),
      p. 8: the Bužek-Hillery cloner, (12)-(15), whose ancilla is the anti-clone (2/3)|psi-perp><psi-perp| +
      (1/3)|psi><psi|; p. 10: the square-root form sqrt((1 - F_A)(1 - F_B)) >= 1/2 - (1 - F_A) - (1 - F_B), (23), with footnote 12
      identifying it with Bužek-Hillery-Bednik's (11) and Cerf's (6); the circuit and a^2 + b^2 + ab = 1, F_A = 1 - b^2/2,
      F_B = 1 - a^2/2, (27)-(28). The journal print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The square-root form: tradeoff_sqrt is their (23) for the six-state averages, tradeoff_forall its worst-case
      form, derived here from the homogeneous bound (including the limit when one clone is perfect); their circuit
      (27) is asymChannel with (a, b) as named here. floor_companion_attained is their Bužek-Hillery clone with its
      anti-clone, (12)-(15): that channel has the averages (5/6, 1/3), so it is asymChannel 2 (-1) by eq_asym_of_floor₂.
  - title: "Optimal manipulations with qubits: Universal-NOT gate"
    authors: ["Vladimir Bužek", "Mark Hillery", "Reinhard F. Werner"]
    id: "doi:10.1103/PhysRevA.60.R2626"
    type: "paper"
    location: >-
      Physical Review A 60 (1999), R2626; read as arXiv:quant-ph/9901053 (https://arxiv.org/abs/quant-ph/9901053),
      all four pages: Delta(T) = max over sigma of Tr[sigma T(sigma^{(x) N})], (2); the Theorem, p. 3: the minimum of
      Delta over all channels is 1/(N + 2), so 1/3 at N = 1. The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The universal-NOT bound in its worst-case (maximum) form. Nothing from it is formalized; sixAvg_ge_third is
      the average form of the bound at N = 1 from the certificate, and exists_sixAvg_eq_third its attainment by the
      universal NOT (1/3)(X rho X + Y rho Y + Z rho Z) on one clone.
  - title: "Spin flips and quantum information for antiparallel spins"
    authors: ["Nicolas Gisin", "Sandu Popescu"]
    id: "doi:10.1103/PhysRevLett.83.432"
    type: "paper"
    location: >-
      Physical Review Letters 83 (1999), 432; read as arXiv:quant-ph/9901072 (https://arxiv.org/abs/quant-ph/9901072),
      pp. 3-4: the spin-flip fidelity int dn <-n| rho |-n>, its optimum 2/3, p. 4 (stated there by reference), so the
      average fidelity to the input is at least 1/3. The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The Bloch-average form of the floor 1/3. Nothing from it is formalized.
  - title: "Universal asymmetric quantum cloning revisited"
    authors: ["Anna-Lena K. Hashagen"]
    id: "arXiv:1607.03723"
    type: "paper"
    location: >-
      Quantum Information and Computation 17 (2017), 747-778; read as arXiv:1607.03723v2 (https://arxiv.org/abs/1607.03723),
      pp. 6-26: the figures of merit (3.1)-(3.5); the reduction to twirled channels (4.2); Theorem 5.5, (5.10), the
      optimal map; the uniqueness remark for d = 2 within symmetrized channels, p. 18; the region in entanglement
      fidelity x_i = <Omega| tau_0i |Omega> over all channels, (6.1)-(6.2), p. 20, with the Choi state
      |Omega><Omega| (x) sigma of a perfect clone and the extreme points (1, 1/d^2) and (0, (d^2 - 1)/d^2), pp. 20-21;
      Theorem 6.4, pp. 24-25, the region by its polar (6.4a) and its upper boundary (6.4b); the floor (5.6b). Also
      read: v1, pp. 22 and 27-28, where the region is (6.3)-(6.4). The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The full description of the achievable single-clone fidelities in every dimension, in entanglement fidelity;
      at d = 2 the average fidelity is (2 x + 1)/3 (Nielsen 2002, (3); the conversion is not printed in her paper),
      and through it her Theorem 6.4 is the floors together with the full-range trade-off, whose upper boundary (6.4b)
      is equality in tradeoff_full_sqrt where 3(F1-bar + F2-bar) >= 7/2; her perfect clone, p. 20, gives the value 1/2
      of sixAvg₂_eq_half_of_sixAvg₁_eq_one. At d = 2 her (5.10) is asymChannel with alpha_2 = alpha, alpha_1 = beta,
      and 2 lambda_max of her (6.4a) is (a + b) + sqrt(a^2 - ab + b^2). Nothing is formalized in her coordinates or
      by her route; her uniqueness is within symmetrized channels, the uniqueness here is over all channels.
  - title: "A geometrical description of the universal 1 -> 2 asymmetric quantum cloning region"
    authors: ["Ion Nechita", "Clément Pellegrini", "Denis Rochette"]
    id: "doi:10.1007/s11128-021-03258-y"
    type: "paper"
    location: >-
      Quantum Information Processing 20 (2021), 333, doi:10.1007/s11128-021-03258-y; read as arXiv:2106.09655v1 (https://arxiv.org/abs/2106.09655),
      pp. 1-6 and 8-14: Definition 2 (worst-case and Haar-average fidelity) and Theorem 4 (equal suprema); the reduction
      to symmetrized channels, Section 3, p. 4; their singlet fractions are the depolarizing parameters p_i, with
      f_i = p_i + (1 - p_i)/d, p. 6; Theorem 5, p. 10, (1 - p_1)(1 - p_2)/d^2 >= ((p_1 + p_2 - 1)/2)^2 for p in
      [-1/(d^2 - 1), 1], the region of the restricted four-permutation family; Theorem 6, (10), p. 12, the general region
      as a union of ellipses for lambda in [0, d]; "can be chosen", p. 10. The journal print was not read.
    relationship: "formalizes"
    author_endorsement: "not-contacted"
    note: >-
      The full region of the Haar-average fidelities (Definition 2) in the singlet-fraction plane, negative singlet
      fractions included. tradeoff_full_sqrt is the necessity half of their Theorem 6 at d = 2 (p = 2F - 1), for the
      six-state averages, proved here by a Gram identity in the Kraus entries and Cauchy-Schwarz rather than by their
      route; the realization of every point is not formalized, that of the boundary arc is tradeoff_full_attained. At
      d = 2 their Theorem 5 is the squared square-root form, equivalently the squared full-range trade-off, for the
      restricted family only: its ellipse excludes points of Theorem 6's region such as (1/3, 1/3) and (1/2, 1/3).
      They claim no uniqueness.
  - title: "Optimal universal quantum cloning: asymmetries and fidelity measures"
    authors: ["Alastair Kay"]
    id: "arXiv:1407.4951"
    type: "paper"
    location: >-
      Quantum Information and Computation 16 (2016), 991; read as arXiv:1407.4951v3 (https://arxiv.org/abs/1407.4951),
      the abstract, pp. 1-5 and p. 8: Definition 1 (averaged fidelities); Theorem 1; (5) at d = 2, N = 2,
      F_1 + F_2 = 1 + ((sqrt(3F_1 - 1) + sqrt(3F_2 - 1))/3)^2; the 3-design remark for joint fidelities, pp. 2-3.
      The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Asymmetric trade-offs under several fidelity measures; his (5) at d = 2 is the same curve (checked by the
      replay). Nothing from it is formalized; no uniqueness of the map.
  - title: "Role of interference in quantum cloning"
    authors: ["Benoit Roubert", "Daniel Braun"]
    id: "doi:10.1103/PhysRevA.78.042311"
    type: "paper"
    location: >-
      Physical Review A 78 (2008), 042311 (the journal title, from Crossref); read as arXiv:0807.1657v1
      (https://arxiv.org/abs/0807.1657), titled there "Quantum Cloning without Interference", pp. 6-12: the
      two-qubit machines and their average fidelities (6)-(7); the 64-parameter family (20)-(22) with the same
      reduced states as Bužek-Hillery, (24); the numerical floor F >= 1/3 within a restricted class, p. 9. The journal
      print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The non-uniqueness of two-qubit machines reaching 5/6: every free entry of their family sits in the sector
      where the blank input is |1>, so the 1 -> 2 channel (the blank-|0> block) is fixed, consistent with the
      uniqueness of the channel proved here. Nothing from it is formalized.
  - title: "A simple formula for the average gate fidelity of a quantum dynamical operation"
    authors: ["Michael A. Nielsen"]
    id: "arXiv:quant-ph/0205035"
    type: "paper"
    location: >-
      Physics Letters A 303 (2002), 249; read as arXiv:quant-ph/0205035v2 (https://arxiv.org/abs/quant-ph/0205035),
      p. 1: the average fidelity (1) and Eq. (3), F-bar = (d F_e + 1)/(d + 1), relating it to the entanglement
      fidelity F_e (credited there to M., P. and R. Horodecki). The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The conversion F-bar = (2 F_e + 1)/3 at d = 2, by which the docs read Hashagen's entanglement-fidelity region
      and her perfect clone as statements about average fidelities. Nothing from it is formalized or used.
  - title: "Fidelity of single qubit maps"
    authors: ["Mark D. Bowdrey", "Daniel K. L. Oi", "Anthony J. Short", "Konrad Banaszek", "Jonathan A. Jones"]
    id: "arXiv:quant-ph/0201106"
    type: "paper"
    location: >-
      Physics Letters A 294 (2002), 258; read as arXiv:quant-ph/0201106v1 (https://arxiv.org/abs/quant-ph/0201106),
      p. 4: Eq. (11), the average fidelity of a single-qubit map with a unitary or anti-unitary map is the mean over
      the six axial pure states; the regular tetrahedron and octahedron remark. The journal print was not read.
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      The equality of the six-state and Bloch-sphere averages for a qubit map, which applies to each marginal here;
      named in the docs, and neither used nor claimed: the figure of merit here is the six-state average.
  - title: "Semidefinite programming for optimal quantum cloning: a computational framework"
    authors: ["Jörg Hettel"]
    id: "arXiv:2605.21274"
    type: "paper"
    location: "https://arxiv.org/abs/2605.21274 (the abstract; 2026-05-20)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Numerical primal-dual certificates for universal, phase-covariant and asymmetric cloners by semidefinite
      programming over Choi matrices; not a formal proof. Nothing from it is used; named as the nearest
      certificate-style neighbour.
  - title: "Asymptotically optimal mixed-state cloning"
    authors: ["Jiani Fei", "Jinzhao Wang"]
    id: "arXiv:2609.35986"
    type: "paper"
    location: "https://arxiv.org/abs/2609.35986 (the abstract; its Lean repository https://github.com/JWang226/Cloning at efc423c, 2026-10-09)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Asymptotic cloning of mixed states under the global root fidelity, with a Lean development (27 named
      results on an adapted physlib, Lean 4.29.0-rc6); a different figure of merit, no single-clone fidelity, no
      1 -> 2 bound, no uniqueness. Nothing from it is used; the nearest formal neighbour.
  - title: "Completely positive linear maps on complex matrices"
    authors: ["Man-Duen Choi"]
    id: "doi:10.1016/0024-3795(75)90075-0"
    type: "paper"
    location: "Linear Algebra and its Applications 10 (1975), 285-290 (not read; named for the theorem that is not proved here)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Named in the docs for the Choi-Kraus theorem (every completely positive map has a Kraus form), which this
      development does not prove: a channel is defined as a finite Kraus family. Nothing is taken from it.
  - title: "States, effects, and operations: fundamental notions of quantum theory"
    authors: ["Karl Kraus"]
    id: "doi:10.1007/3-540-12732-1"
    type: "book"
    location: "Lecture Notes in Physics 190, Springer (1983) (not read; named for the Kraus form of a channel)"
    relationship: "background"
    author_endorsement: "not-contacted"
    note: >-
      Named for the Kraus form rho -> sum K_i rho K_i^* with sum K_i^* K_i = 1 that defines a channel here. Nothing is
      taken from it.
  - title: "PalomarSubmission: the registry's submission checks and core-notation audit"
    authors: ["The Palomar registry (PalomarRegistry/PalomarSubmission)"]
    id: "https://github.com/PalomarRegistry/PalomarSubmission"
    type: "other"
    location: "scripts/core_notation_audit.lean in this repository, copied with a three-line provenance comment; MIT (LICENSES/PalomarSubmission-MIT.txt)"
    relationship: "other"
    author_endorsement: "not-contacted"
    note: >-
      The registry's own renderability audit script, run locally by scripts/verify.py. No mathematics is taken from
      it.

